<template>
    <p class="rpm-lede">
        Every alert moves through the same six steps, and each card shows only the next one. Critical readings can't move past the call
        until all three call questions are answered.
    </p>
    <template lwc:if={error}>
        <div class="rpm-alertbox rpm-error" role="alert">{error}</div>
    </template>

    <div class="rpm-filters">
        <div class="rpm-seg" role="group" aria-label="Filter alerts">
            <template for:each={filterButtons} for:item="f">
                <button key={f.value} class={f.cls} data-value={f.value} onclick={changeFilter}>{f.label}</button>
            </template>
        </div>
        <button class="rpm-btn rpm-btn_sm" onclick={load}>Refresh</button>
    </div>

    <template lwc:if={loading}>
        <lightning-spinner alternative-text="Loading alerts" size="small"></lightning-spinner>
    </template>

    <template for:each={cards} for:item="a">
        <article key={a.id} class={a.cardClass}>
            <div class="rpm-alert__top">
                <span class={a.chipClass}>{a.severityText}</span>
                <span class="rpm-alert__k">{a.summary}</span>
                <template lwc:if={a.overdue}><span class="rpm-tag rpm-tag_rose">Overdue</span></template>
            </div>
            <div class="rpm-alert__meta">
                <button class="rpm-link" data-id={a.patientId} onclick={openPatient}>{a.patientName}</button>
                <span class="rpm-sep">—</span>{a.metaText}
            </div>

            <div class="rpm-track6" aria-label={a.stepAria}>
                <template for:each={a.segments} for:item="s">
                    <div key={s.key} class={s.cls}>
                        <div class="rpm-st__bar"></div>
                        <span>{s.label}</span>
                    </div>
                </template>
            </div>

            <div class="rpm-alert__act">
                <template lwc:if={a.isClosed}>
                    <span class="rpm-tag rpm-tag_slate">Closed: {a.disposition}</span>
                </template>
                <template lwc:elseif={a.isDevice}>
                    <button class="rpm-btn rpm-btn_primary" data-id={a.id} onclick={fixDevice}>Mark fixed and close</button>
                    <button class="rpm-btn" onclick={goDevices}>Open Devices</button>
                </template>
                <template lwc:elseif={a.atNew}>
                    <button class="rpm-btn rpm-btn_primary" data-id={a.id} onclick={markChecked}>Mark checked</button>
                </template>
                <template lwc:elseif={a.atChecked}>
                    <select class="rpm-select rpm-inline" aria-label="Owner" data-id={a.id} onchange={chooseOwner}>
                        <option value="">Choose an owner</option>
                        <template for:each={team} for:item="u">
                            <option key={u.value} value={u.value}>{u.label}</option>
                        </template>
                    </select>
                    <button class="rpm-btn rpm-btn_primary" data-id={a.id} onclick={assign}>Assign</button>
                </template>
                <template lwc:elseif={a.atAssigned}>
                    <button class={a.callClass} data-id={a.id} onclick={recordCall}>Record the call</button>
                </template>
                <template lwc:elseif={a.atCalled}>
                    <button class="rpm-btn rpm-btn_primary" data-id={a.id} onclick={reviewed}>Provider reviewed</button>
                </template>
                <template lwc:elseif={a.atReviewed}>
                    <select class="rpm-select rpm-inline" aria-label="Outcome" data-id={a.id} onchange={chooseDisposition}>
                        <option value="">What was done?</option>
                        <template for:each={dispositionOptions} for:item="d">
                            <option key={d.value} value={d.value}>{d.label}</option>
                        </template>
                    </select>
                    <button class="rpm-btn rpm-btn_primary" data-id={a.id} onclick={closeAlert}>Close alert</button>
                </template>
            </div>

            <details class="rpm-log">
                <summary>History ({a.historyCount})</summary>
                <div class="rpm-timeline">
                    <template for:each={a.historyRows} for:item="h">
                        <div key={h.id} class="rpm-tl">
                            <span class="rpm-tl__t">{h.when}</span>
                            <span class="rpm-tl__p"></span>
                            <span class="rpm-tl__d"><b>{h.step}</b>: {h.detail} <span class="rpm-muted">by {h.by}</span></span>
                        </div>
                    </template>
                </div>
            </details>
        </article>
    </template>
    <template lwc:if={noCards}>
        <div class="rpm-card"><div class="rpm-empty">{emptyText}</div></div>
    </template>

    <div class="rpm-infobox">
        Response times come from the active alert protocol: critical 60 minutes, urgent 4 hours, routine 72 hours. Device alerts can be
        closed as soon as the cuff is fixed or swapped.
    </div>
</template>

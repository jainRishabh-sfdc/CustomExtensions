<template>
    <template lwc:if={error}>
        <div class="rpm-alertbox rpm-error" role="alert">{error}</div>
    </template>
    <template lwc:if={risk}>
        <div class="rpm-infobox rpm-filterbar">
            Showing patients flagged {riskText} only
            <button class="rpm-btn rpm-btn_sm" onclick={clearRisk}>Show everyone</button>
        </div>
    </template>

    <div class="rpm-split">
        <div class="rpm-card rpm-roster">
            <div class="rpm-card__h"><h2>Patients</h2><span class="rpm-muted">{rosterCount}</span></div>
            <div class="rpm-search">
                <input type="search" placeholder="Find a patient" aria-label="Find a patient" oninput={handleSearch} />
            </div>
            <div class="rpm-roster__list">
                <template for:each={rosterRows} for:item="p">
                    <button key={p.id} class={p.rowClass} data-id={p.id} onclick={selectPatient}>
                        <span>
                            <span class="rpm-roster__name">{p.name}</span>
                            <span class="rpm-roster__sub">{p.subtitle}</span>
                        </span>
                        <span class={p.riskClass} title={p.reasons}><span class="rpm-dot"></span>{p.riskText}</span>
                    </button>
                </template>
                <template lwc:if={noPatients}>
                    <div class="rpm-empty">No patients match.</div>
                </template>
            </div>
        </div>

        <div class="rpm-detail">
            <template lwc:if={loadingDetail}>
                <lightning-spinner alternative-text="Loading patient" size="small"></lightning-spinner>
            </template>
            <template lwc:if={detail}>
                <div class="rpm-card">
                    <div class="rpm-ph">
                        <div>
                            <div class="rpm-ph__name">{detail.name}</div>
                            <div class="rpm-ph__facts">{detailFacts}</div>
                            <div class="rpm-ph__tags">
                                <span class={detailRiskClass}><span class="rpm-dot"></span>{detailRiskText}</span>
                                <template lwc:if={detail.locked}>
                                    <span class="rpm-tag rpm-tag_slate">RPM billing locked</span>
                                </template>
                                <template lwc:else>
                                    <span class="rpm-tag rpm-tag_emerald">RPM billing on</span>
                                </template>
                                <template lwc:if={noConsent}>
                                    <span class="rpm-tag rpm-tag_rose">Consent missing</span>
                                </template>
                                <template for:each={deviceTags} for:item="d">
                                    <span key={d.id} class={d.cls}>{d.text}</span>
                                </template>
                            </div>
                        </div>
                        <div class="rpm-ph__side">
                            <div class="rpm-seg" role="group" aria-label="Chart range">
                                <template for:each={rangeButtons} for:item="r">
                                    <button key={r.days} class={r.cls} data-days={r.days} onclick={changeRange}>{r.label}</button>
                                </template>
                            </div>
                            <a class="rpm-link" href={recordUrl} target="_blank">Open record</a>
                        </div>
                    </div>
                    <template lwc:if={detail.reasons}>
                        <div class="rpm-alertbox rpm-why">Needs attention: {detail.reasons}</div>
                    </template>
                    <c-rpm-bp-chart
                        readings={detail.readings}
                        alert-line={detail.alertLine}
                        critical-line={detail.criticalLine}
                        low-line={detail.lowLine}
                        target-high={detail.targetSysHigh}
                        target-low={detail.targetSysLow}
                    ></c-rpm-bp-chart>
                    <div class="rpm-readout">
                        <template for:each={readout} for:item="o">
                            <div key={o.k}>
                                <div class="rpm-readout__k">{o.k}</div>
                                <div class="rpm-readout__v">{o.v}</div>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="rpm-grid2">
                    <div class="rpm-card">
                        <div class="rpm-card__h"><h2>Care time this month</h2><span class="rpm-tag rpm-tag_indigo">{totalMinutes} min</span></div>
                        <div class="rpm-card__sub">Tick interactive for a live call or video. Management codes need it.</div>
                        <div class="rpm-card__b">
                            <div class="rpm-form2">
                                <label class="rpm-field">
                                    Activity
                                    <select onchange={handleActivity}>
                                        <template for:each={activityOptions} for:item="a">
                                            <option key={a.value} value={a.value} selected={a.selected}>{a.label}</option>
                                        </template>
                                    </select>
                                </label>
                                <label class="rpm-field">
                                    Minutes
                                    <input type="number" min="1" max="240" value={minutes} onchange={handleMinutes} />
                                </label>
                            </div>
                            <label class="rpm-check">
                                <input type="checkbox" checked={interactive} onchange={handleInteractive} />
                                Talked live with the patient or caregiver
                            </label>
                            <label class="rpm-field">
                                Note
                                <input type="text" maxlength="255" placeholder="Optional" value={note} onchange={handleNote} />
                            </label>
                            <div class="rpm-actions">
                                <button class="rpm-btn rpm-btn_primary" onclick={logTime} disabled={saving}>Log time</button>
                            </div>
                            <template for:each={timeRows} for:item="t">
                                <div key={t.id} class="rpm-entry">
                                    <div class="rpm-entry__m">{t.when}, {t.minutes} min, {t.by}</div>
                                    <div>
                                        {t.activity}
                                        <template lwc:if={t.interactive}><span class="rpm-tag rpm-tag_indigo rpm-entry__tag">Interactive</span></template>
                                        <template lwc:if={t.note}><span class="rpm-muted"> — {t.note}</span></template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="rpm-card">
                        <div class="rpm-card__h"><h2>Billing this month</h2><span class={billingStatusClass}>{billing.status}</span></div>
                        <div class="rpm-card__sub">Rules {billing.rulesVersion}. Updates as readings and minutes come in.</div>
                        <div class="rpm-card__b">
                            <template lwc:if={billing.blockedReason}>
                                <div class="rpm-alertbox rpm-gap">{billing.blockedReason}. No RPM codes are produced.</div>
                            </template>
                            <div class="rpm-meters">
                                <div class="rpm-meter">
                                    <div class="rpm-meter__top"><span>Reading days</span><b>{daysMeter.value} / 16</b></div>
                                    <div class="rpm-track"><i class={daysMeter.fillClass} style={daysMeter.style}></i></div>
                                </div>
                                <div class="rpm-meter">
                                    <div class="rpm-meter__top"><span>Care minutes</span><b>{minutesMeter.value} / 20</b></div>
                                    <div class="rpm-track"><i class={minutesMeter.fillClass} style={minutesMeter.style}></i></div>
                                </div>
                            </div>
                            <div class="rpm-codes">
                                <template lwc:if={hasCodes}>
                                    <div class="rpm-cpts">
                                        <template for:each={codePills} for:item="c">
                                            <span key={c.key} class="rpm-cpt">{c.text}<span class="rpm-cpt__label">{c.label}</span></span>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:else><span class="rpm-muted">No codes earned yet.</span></template>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="rpm-card">
                    <div class="rpm-card__h"><h2>Open alerts</h2><span class="rpm-muted">{alertCount}</span></div>
                    <div class="rpm-card__b">
                        <template for:each={alertRows} for:item="a">
                            <div key={a.id} class="rpm-entry rpm-entry_row">
                                <span class={a.chipClass}>{a.severityText}</span>
                                <span>{a.summary}</span>
                                <span class="rpm-muted rpm-push">{a.step}</span>
                            </div>
                        </template>
                        <template lwc:if={noAlerts}>
                            <div class="rpm-empty">Nothing open for this patient.</div>
                        </template>
                        <template lwc:else>
                            <div class="rpm-actions"><button class="rpm-btn" onclick={goAlerts}>Work these alerts</button></div>
                        </template>
                    </div>
                </div>
            </template>
            <template lwc:elseif={noSelection}>
                <div class="rpm-card"><div class="rpm-empty">Choose a patient on the left.</div></div>
            </template>
        </div>
    </div>
</template>

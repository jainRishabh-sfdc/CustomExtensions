<template>
    <p class="rpm-lede">
        Codes are worked out from reading days and logged minutes. Patients paid through a CMS model, or without consent, never produce RPM
        codes. Check each payer's policy before you submit.
    </p>
    <template lwc:if={error}>
        <div class="rpm-alertbox rpm-error" role="alert">{error}</div>
    </template>
    <template lwc:if={loading}>
        <lightning-spinner alternative-text="Recalculating billing" size="small"></lightning-spinner>
    </template>

    <div class="rpm-stats">
        <div class="rpm-stat rpm-stat_emerald"><div class="rpm-stat__v">{earning}</div><div class="rpm-stat__l">Patients earning codes</div></div>
        <div class="rpm-stat rpm-stat_indigo"><div class="rpm-stat__v">{codeUnits}</div><div class="rpm-stat__l">Code units so far this month</div></div>
        <div class="rpm-stat rpm-stat_amber"><div class="rpm-stat__v">{notYet}</div><div class="rpm-stat__l">Not enough data yet</div></div>
        <div class="rpm-stat rpm-stat_rose"><div class="rpm-stat__v">{blocked}</div><div class="rpm-stat__l">Blocked</div></div>
    </div>

    <div class="rpm-card">
        <div class="rpm-card__h"><h2>{periodLabel}</h2><span class="rpm-tag rpm-tag_indigo">{rulesVersion}</span></div>
        <div class="rpm-card__sub">99445: 2–15 reading days. 99454: 16 or more. 99470: 10–19 interactive minutes. 99457: 20 or more. 99458: each further 20.</div>
        <div class="rpm-card__b rpm-card__b_flush rpm-scroll">
            <table class="rpm-table">
                <thead>
                    <tr><th>Patient</th><th>Reading days</th><th>Care minutes</th><th>Codes</th><th></th></tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="r">
                        <tr key={r.patientId}>
                            <td><button class="rpm-link" data-id={r.patientId} onclick={openPatient}>{r.patientName}</button></td>
                            <td>
                                <div class="rpm-meter">
                                    <div class="rpm-meter__top"><span>Days</span><b>{r.daysMeter.value} / 16</b></div>
                                    <div class="rpm-track"><i class={r.daysMeter.fillClass} style={r.daysMeter.style}></i></div>
                                </div>
                            </td>
                            <td>
                                <div class="rpm-meter">
                                    <div class="rpm-meter__top"><span>{r.interactiveText}</span><b>{r.minutesMeter.value} / 20</b></div>
                                    <div class="rpm-track"><i class={r.minutesMeter.fillClass} style={r.minutesMeter.style}></i></div>
                                </div>
                            </td>
                            <td>
                                <template lwc:if={r.blockedReason}><span class="rpm-tag rpm-tag_rose">{r.blockedReason}</span></template>
                                <template lwc:elseif={r.hasCodes}>
                                    <div class="rpm-cpts">
                                        <template for:each={r.pills} for:item="c">
                                            <span key={c.key} class="rpm-cpt">{c.text}<span class="rpm-cpt__label">{c.label}</span></span>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:else><span class="rpm-muted">None yet</span></template>
                            </td>
                            <td class="rpm-right">
                                <button class="rpm-btn rpm-btn_sm" data-id={r.patientId} aria-expanded={r.expanded} onclick={toggleAudit}>{r.auditLabel}</button>
                            </td>
                        </tr>
                        <template lwc:if={r.open}>
                            <tr key={r.auditKey} class="rpm-auditrow">
                                <td colspan="5">
                                    <div class="rpm-timeline">
                                        <template for:each={r.audit} for:item="line">
                                            <div key={line.key} class="rpm-tl rpm-tl_nodate">
                                                <span class="rpm-tl__p"></span>
                                                <span class="rpm-tl__d">{line.text}</span>
                                            </div>
                                        </template>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </template>
                </tbody>
            </table>
            <template lwc:if={noRows}><div class="rpm-empty">No enrolled patients yet.</div></template>
        </div>
    </div>
</template>

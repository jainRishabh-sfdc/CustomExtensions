<template>
    <lightning-modal-header label="Hand out a cuff"></lightning-modal-header>
    <lightning-modal-body>
        <div class="rpm-m">
            <div class="rpm-steps4">
                <template for:each={steps} for:item="s">
                    <div key={s.key} class={s.cls}>{s.label}</div>
                </template>
            </div>

            <template lwc:if={isStep1}>
                <p class="rpm-m__lead">
                    Check the box label matches <strong class="rpm-m__mono">{deviceLabel}</strong><br />
                    <span class="rpm-m__sub">{model}, IMEI {imei}</span>
                </p>
            </template>

            <template lwc:if={isStep2}>
                <label class="rpm-m__field">
                    Patient
                    <select onchange={handlePatient}>
                        <option value="">Choose a patient</option>
                        <template for:each={patientOptions} for:item="p">
                            <option key={p.value} value={p.value} selected={p.selected}>{p.label}</option>
                        </template>
                    </select>
                </label>
                <label class="rpm-m__check">
                    <input type="checkbox" checked={identity} onchange={handleIdentity} />
                    I confirmed name and date of birth with the patient
                </label>
            </template>

            <template lwc:if={isStep3}>
                <label class="rpm-m__check">
                    <input type="checkbox" checked={training} onchange={handleTraining} />
                    Patient took a seated reading and showed it back to me
                </label>
                <label class="rpm-m__check">
                    <input type="checkbox" checked={testReading} onchange={handleTest} />
                    The test reading arrived under the right name
                </label>
                <label class="rpm-m__check">
                    <input type="checkbox" checked={loaner} onchange={handleLoaner} />
                    Patient knows the cuff is a practice-owned loaner
                </label>
            </template>

            <template lwc:if={isStep4}>
                <p class="rpm-m__lead">{deviceLabel} will be linked to <strong>{patientName}</strong>. Every reading from now on lands in their chart.</p>
            </template>

            <template lwc:if={error}>
                <div class="rpm-m__err">{error}</div>
            </template>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <div class="rpm-m__foot">
            <button class="rpm-m__btn" onclick={cancel}>Cancel</button>
            <template lwc:if={isStep4}>
                <button class="rpm-m__btn rpm-m__btn_primary" onclick={finish}>Hand out and go live</button>
            </template>
            <template lwc:else>
                <button class="rpm-m__btn rpm-m__btn_primary" onclick={next}>{nextLabel}</button>
            </template>
        </div>
    </lightning-modal-footer>
</template>

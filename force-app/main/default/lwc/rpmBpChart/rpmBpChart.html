<template>
    <template lwc:if={hasData}>
        <div class="rpm-chart">
            <svg viewBox={viewBox} role="img" aria-label="Blood pressure trend">
                <template for:each={grid} for:item="g">
                    <g key={g.key}>
                        <line x1={g.x1} y1={g.y} x2={g.x2} y2={g.y} class="rpm-grid"></line>
                        <text x={g.tx} y={g.ty} text-anchor="end" class="rpm-axis">{g.label}</text>
                    </g>
                </template>
                <template lwc:if={target}>
                    <rect x={target.x} y={target.y} width={target.w} height={target.h} rx="4" class="rpm-band"></rect>
                    <text x={target.tx} y={target.ty} text-anchor="end" class="rpm-band__label">{target.label}</text>
                </template>
                <template for:each={lines} for:item="l">
                    <g key={l.key}>
                        <line x1={l.x1} y1={l.y} x2={l.x2} y2={l.y} class={l.cls}></line>
                        <text x={l.tx} y={l.ty} class={l.tcls}>{l.label}</text>
                    </g>
                </template>
                <template lwc:if={hasDia}>
                    <path d={diaArea} class="rpm-area rpm-area_dia"></path>
                    <path d={diaLine} class="rpm-curve rpm-curve_dia"></path>
                </template>
                <path d={sysArea} class="rpm-area rpm-area_sys"></path>
                <path d={sysLine} class="rpm-curve rpm-curve_sys"></path>
                <template for:each={points} for:item="p">
                    <g key={p.key}>
                        <title>{p.title}</title>
                        <template lwc:if={p.hasDia}>
                            <circle cx={p.x} cy={p.diaY} r="3" class="rpm-pt_dia"></circle>
                        </template>
                        <circle cx={p.x} cy={p.sysY} r={p.sysR} class={p.sysCls}></circle>
                        <template lwc:if={p.flagged}>
                            <rect x={p.badgeX} y={p.badgeY} width="40" height="18" rx="5" class={p.badgeCls}></rect>
                            <text x={p.x} y={p.valueY} text-anchor="middle" class="rpm-badge__text">{p.value}</text>
                        </template>
                        <template lwc:if={p.showLabel}>
                            <text x={p.x} y={p.labelY} text-anchor="middle" class="rpm-axis">{p.label}</text>
                        </template>
                    </g>
                </template>
            </svg>
        </div>
        <div class="rpm-legend">
            <span><i class="rpm-sw rpm-sw_sys"></i>Systolic (alerts use this)</span>
            <span><i class="rpm-sw rpm-sw_dia"></i>Diastolic (charted only)</span>
            <span><i class="rpm-sw rpm-sw_warn"></i>Outside call or low line</span>
            <span><i class="rpm-sw rpm-sw_crit"></i>Above emergency line</span>
        </div>
    </template>
    <template lwc:else>
        <div class="rpm-empty">No readings in this range. Check the cuff on the Devices tab.</div>
    </template>
</template>

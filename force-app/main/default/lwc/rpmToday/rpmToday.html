<template>
    <p class="rpm-lede">Work this list from the top. Critical readings come first, then whatever is closest to its response time.</p>
    <template lwc:if={error}>
        <div class="rpm-alertbox rpm-error" role="alert">{error}</div>
    </template>
    <template lwc:if={loading}>
        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
    </template>
    <template lwc:if={data}>
        <div class="rpm-stats">
            <template for:each={stats} for:item="s">
                <button key={s.key} class={s.cls} data-tab={s.tab} data-filter={s.filter} data-risk={s.risk} onclick={handleStat}>
                    <div class="rpm-stat__v">{s.value}</div>
                    <div class="rpm-stat__l">{s.label}</div>
                </button>
            </template>
        </div>

        <div class="rpm-card">
            <div class="rpm-card__h"><h2>Queue</h2><span class="rpm-muted">{openCount} open</span></div>
            <div class="rpm-card__sub">Each row opens the alert it belongs to.</div>
            <div class="rpm-card__b rpm-card__b_flush">
                <template for:each={queue} for:item="q">
                    <div key={q.id} class="rpm-queue">
                        <span class={q.whenClass}>{q.whenLabel}</span>
                        <div>
                            <div class="rpm-queue__what">{q.summary}</div>
                            <div class="rpm-queue__meta">
                                <button class="rpm-link" data-id={q.patientId} onclick={openPatient}>{q.patientName}</button>
                                <span class="rpm-sep">—</span>{q.metaText}
                            </div>
                        </div>
                        <button class={q.buttonClass} data-filter={q.filter} onclick={openAlert}>Open alert</button>
                    </div>
                </template>
                <template lwc:if={queueEmpty}>
                    <div class="rpm-empty">Queue is clear. New readings will appear here as they arrive.</div>
                </template>
            </div>
        </div>
    </template>
</template>

<template>
    <p class="rpm-intro">Start here each morning. Every number is a button that opens the work behind it. Most urgent first.</p>
    <template lwc:if={error}>
        <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">{error}</div>
    </template>
    <template lwc:if={loading}>
        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
    </template>
    <template lwc:if={data}>
        <div class="rpm-kpis">
            <template for:each={kpis} for:item="k">
                <button key={k.key} class={k.cls} data-tab={k.tab} data-filter={k.filter} data-risk={k.risk} onclick={handleKpi}>
                    <div class="rpm-kpi__v">{k.value}</div>
                    <div class="rpm-kpi__l">{k.label}</div>
                </button>
            </template>
        </div>

        <div class="rpm-panel">
            <div class="rpm-panel__head">Today's to-do list</div>
            <div class="rpm-panel__sub">Open alerts, critical first, then by how soon they are due.</div>
            <div class="rpm-panel__body">
                <template lwc:if={hasTodo}>
                    <template for:each={todo} for:item="t">
                        <div key={t.id} class="rpm-todo">
                            <span class={t.chipClass}>{t.chipLabel}</span>
                            <div class="rpm-todo__main">
                                <div class="rpm-todo__title">{t.summary}</div>
                                <div class="rpm-muted">
                                    <button class="rpm-link" data-id={t.patientId} onclick={openPatient}>{t.patientName}</button>
                                    · step {t.step} · {t.ownerText} · {t.dueText}
                                </div>
                            </div>
                            <lightning-button
                                label="Open alert"
                                variant={t.buttonVariant}
                                data-filter={t.filter}
                                onclick={openAlert}
                            ></lightning-button>
                        </div>
                    </template>
                </template>
                <template lwc:else>
                    <div class="rpm-empty">Nothing open — all clear.</div>
                </template>
            </div>
        </div>

        <div class="rpm-panel">
            <div class="rpm-panel__head">How this console works</div>
            <div class="rpm-panel__body rpm-muted">
                Green / Yellow / Red next to a patient shows how much attention they need. Alerts walk six steps so
                nothing gets dropped. Billing shows which RPM codes each patient has earned this month.
            </div>
        </div>
    </template>
</template>
